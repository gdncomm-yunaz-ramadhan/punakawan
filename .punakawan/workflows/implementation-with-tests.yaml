version: punakawan.workflow/v1
id: implementation-with-tests
name: Implementation with Tests
description: >-
  Implement a ready task and prove it with tests before review: build the
  bounded task context, write the change, run the project's tests, check the
  diff, then independently verify that nothing reachable from the change was
  left uncovered. Requires the project's test command to be known up front.
enabled: true
revision: 2
selectors:
  - capability: task
    intent: implement
required_metadata:
  - test.command
allowed_capabilities:
  - build_task_context
  - write_files
  - run_tests
  - check_diff
  - verify_impact_coverage
steps:
  - id: context
    capability: build_task_context
    intent: assemble
  - id: implement
    capability: write_files
    intent: change
    input_from:
      - context
  - id: test
    capability: run_tests
    intent: verify
    input_from:
      - implement
  - id: diff
    capability: check_diff
    intent: verify
    input_from:
      - implement
  # Independent verification: walk the impact graph out from what changed and
  # confirm nothing reachable is left untested or in dispute. This runs on the
  # recorded test and diff evidence, and unlike the lane role-stage tools it
  # needs no delivery lane or lease, so it can actually execute as a step here.
  - id: verify
    capability: verify_impact_coverage
    intent: verify
    input_from:
      - test
      - diff
output:
  type: bagong-review
