version: punakawan.workflow/v1
id: demo-review
name: Demo Review
description: Build a task-context dossier, then run an independent Bagong review.
enabled: false
inputs:
    - name: task_id
      type: string
      required: true
steps:
    - capability: build_context_dossier
      intent: Assemble task context
      id: dossier
    - capability: submit_bagong_review
      intent: Independent senior-maintainer review
      id: review
      input_from:
        - dossier
revision: 1
