version: punakawan.workflow/v1
id: repo-orientation
name: Repository Orientation
description: >-
  Orient in a repository before substantial work: assemble the context dossier,
  then pull scoped durable knowledge. A read-only warm-up that leaves a
  structured trace for later reuse.
enabled: true
revision: 1
selectors:
  - capability: repository
    intent: orient
allowed_capabilities:
  - build_context_dossier
  - search_knowledge
steps:
  - id: dossier
    capability: build_context_dossier
    intent: assemble
  - id: knowledge
    capability: search_knowledge
    intent: retrieve
    input_from:
      - dossier
